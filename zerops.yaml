zerops:
  - setup: evolution
    build:
      base: ubuntu/go@1.22
      envVariables:
        GOMODCACHE: /var/www/.go-mod-cache
        GOCACHE: /var/www/.go-build-cache
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential git curl ca-certificates libjpeg-turbo8-dev libwebp-dev
        - curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz -o /tmp/go1.26.0.tgz && sudo rm -rf /usr/local/go-1.26 && sudo mkdir -p /usr/local/go-1.26 && sudo tar -C /usr/local/go-1.26 --strip-components=1 -xzf /tmp/go1.26.0.tgz && rm -f /tmp/go1.26.0.tgz
      buildCommands:
        - export GOROOT="/usr/local/go-1.26" && export PATH="/usr/local/go-1.26/bin:$PATH" && go version && CGO_ENABLED=1 go build -ldflags "-X main.version=$(cat VERSION)" -o evolution ./cmd/evolution-go
      deployFiles:
        - evolution
        - start.sh
        - manager
        - VERSION
        - db_init.sql
        - public
      cache:
        - .go-mod-cache
        - .go-build-cache
    deploy:
      readinessCheck:
        httpGet:
          port: 8085
          path: /server/ok
    run:
      base: ubuntu/go@1.22
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends curl tzdata ffmpeg poppler-utils postgresql-client
      ports:
        - port: 8085
          httpSupport: true
      initCommands:
        - |
          case "$DATABASE_INIT_URL" in
            ""|*\${*) echo "INFO: PostgreSQL not wired yet, skipping db_init.sql" ;;
            *)
              for i in $(seq 1 30); do
                pg_isready -h "$POSTGRES_HOST" -p "${POSTGRES_PORT:-5432}" && break || sleep 1
              done
              psql "$DATABASE_INIT_URL" -v ON_ERROR_STOP=1 -v app_user="${POSTGRES_USER}" -f /var/www/db_init.sql
              ;;
          esac
      envVariables:
        SERVER_PORT: "8085"
        CLIENT_NAME: "evolution"
        DATABASE_INIT_URL: "postgresql://${database_superUser}:${database_superUserPassword}@${database_hostname}:${database_port}/${database_dbName}"
        POSTGRES_AUTH_DB: "postgresql://${database_user}:${database_password}@${database_hostname}:${database_port}/evogo_auth?sslmode=disable"
        POSTGRES_USERS_DB: "postgresql://${database_user}:${database_password}@${database_hostname}:${database_port}/evogo_users?sslmode=disable"
        POSTGRES_HOST: ${database_hostname}
        POSTGRES_PORT: ${database_port}
        POSTGRES_USER: ${database_user}
        POSTGRES_PASSWORD: ${database_password}
        POSTGRES_DB: "evogo_auth"
        GLOBAL_API_KEY: ${EVOLUTION_API_KEY}
        EVOLUTION_INSTANCE: ${PROJECT_NAME}
        NATS_URL: ${nats_connectionString}
        NATS_GLOBAL_ENABLED: "true"
        NATS_GLOBAL_EVENTS: "ALL"
        LOGTYPE: "console"
        DATABASE_SAVE_MESSAGES: "true"
        CONNECT_ON_STARTUP: "true"
        OS_NAME: "Evolution GO"
        TZ: "UTC"
      start: bash start.sh
      healthCheck:
        httpGet:
          port: 8085
          path: /server/ok
